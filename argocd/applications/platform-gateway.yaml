apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/remcowildeboer/platform-homelab.git
    targetRevision: HEAD
    path: platform/gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
